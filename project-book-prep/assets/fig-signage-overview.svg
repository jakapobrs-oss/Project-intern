<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Angsana New','Leelawadee UI',sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <!-- ส่วนจัดการเนื้อหา -->
  <rect x="40" y="130" width="200" height="96" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="140" y="170" text-anchor="middle" font-size="26" font-weight="bold">ส่วนจัดการเนื้อหา</text>
  <text x="140" y="200" text-anchor="middle" font-size="22">(Content Management)</text>
  <!-- เครือข่าย -->
  <ellipse cx="390" cy="178" rx="92" ry="50" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="172" text-anchor="middle" font-size="24" font-weight="bold">เครือข่ายภายใน</text>
  <text x="390" y="198" text-anchor="middle" font-size="21">(LAN)</text>
  <!-- จอแสดงผล 3 จุด -->
  <g stroke="#333" stroke-width="2">
    <rect x="600" y="48"  width="160" height="76" rx="4" fill="#f2f2f2"/>
    <rect x="612" y="58"  width="136" height="44" fill="#fff"/>
    <rect x="600" y="142" width="160" height="76" rx="4" fill="#f2f2f2"/>
    <rect x="612" y="152" width="136" height="44" fill="#fff"/>
    <rect x="600" y="236" width="160" height="76" rx="4" fill="#f2f2f2"/>
    <rect x="612" y="246" width="136" height="44" fill="#fff"/>
  </g>
  <text x="680" y="86"  text-anchor="middle" font-size="20">จอแสดงผลจุดที่ 1</text>
  <text x="680" y="180" text-anchor="middle" font-size="20">จอแสดงผลจุดที่ 2</text>
  <text x="680" y="274" text-anchor="middle" font-size="20">จอแสดงผลจุดที่ 3</text>
  <!-- ลูกศร -->
  <line x1="240" y1="178" x2="292" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="470" y1="150" x2="596" y2="90"  stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="482" y1="178" x2="596" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="470" y1="206" x2="596" y2="268" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="266" y="164" text-anchor="middle" font-size="19">เผยแพร่</text>
</svg>
