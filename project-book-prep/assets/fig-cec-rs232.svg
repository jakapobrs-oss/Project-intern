<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Angsana New','Leelawadee UI',sans-serif">
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <!-- อุปกรณ์เล่นสื่อ -->
  <rect x="50" y="100" width="210" height="110" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="155" y="145" text-anchor="middle" font-size="25" font-weight="bold">อุปกรณ์เล่นสื่อ</text>
  <text x="155" y="176" text-anchor="middle" font-size="21">(Player / กล่องควบคุม)</text>
  <!-- จอโทรทัศน์ -->
  <rect x="540" y="60" width="210" height="130" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <rect x="554" y="74" width="182" height="86" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="620" y="190" width="50" height="14" fill="#333"/>
  <rect x="590" y="204" width="110" height="8" rx="3" fill="#333"/>
  <text x="645" y="124" text-anchor="middle" font-size="24" font-weight="bold">จอโทรทัศน์</text>
  <!-- เส้น HDMI (CEC) -->
  <line x1="260" y1="128" x2="536" y2="106" stroke="#333" stroke-width="2.5" marker-end="url(#ah2)"/>
  <text x="398" y="96" text-anchor="middle" font-size="21">สาย HDMI — ส่งคำสั่ง CEC (เปิด/ปิด/สลับสัญญาณ)</text>
  <!-- เส้น RS-232 -->
  <line x1="260" y1="186" x2="536" y2="172" stroke="#333" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ah2)"/>
  <text x="398" y="216" text-anchor="middle" font-size="21">สาย Serial — คำสั่ง RS-232 ตามโปรโตคอลของผู้ผลิต</text>
  <!-- ป้ายกำกับสองทาง -->
  <text x="398" y="262" text-anchor="middle" font-size="19" fill="#555">รองรับหลายยี่ห้อ เช่น Samsung (MDC), LG, Sony</text>
</svg>
