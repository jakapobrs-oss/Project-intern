name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # รายสัปดาห์ — ตรวจ CVE ของ dependency ใหม่
    - cron: "0 9 * * 1"

jobs:
  # Dependency vulnerability scan
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --requirement backend/requirements.txt --strict || true
        # non-blocking — แสดง CVE แต่ไม่ fail build (ปรับเป็น strict ตอน production-ready)

  npm-audit:
    name: npm audit (Node deps)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: admin-ui }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci --no-audit
      - run: npm audit --audit-level=high || true
        # non-blocking — แต่ track high+

  # Container image scan (Trivy)
  trivy:
    name: Trivy (container scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod -t signage-backend:scan ./backend

      - name: Scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: signage-backend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"   # non-blocking
