name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# จำกัด run พร้อมกัน — ถ้า push ซ้ำ → cancel ของเก่า
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend — lint + typecheck + pytest
  # ============================================================================
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type-check (mypy) — non-blocking
        run: mypy app --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # ใช้ SQLite in-memory ใน CI (conftest.py override get_db อยู่แล้ว)
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci_test_secret_not_for_production"
          DEVICE_TOKEN_SECRET: "ci_test_secret_2"

  # ============================================================================
  # Admin UI — lint + typecheck + build
  # ============================================================================
  admin-ui:
    name: Admin UI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ============================================================================
  # Player Web — JS/CSS syntax check
  # ============================================================================
  player-web:
    name: Player Web (JS/CSS syntax)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS syntax
        run: |
          node --check player/web/app.js
          node --check player/web/sw.js

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('player/web/manifest.json', 'utf8'))"

  # ============================================================================
  # Docker build smoke — production images ต้อง build ได้
  # ============================================================================
  docker-build:
    name: Docker build (prod images)
    runs-on: ubuntu-latest
    needs: [backend, admin-ui]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend prod image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: signage-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin-ui prod image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-ui
          file: ./admin-ui/Dockerfile.prod
          push: false
          tags: signage-admin-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # E2E smoke — full stack ใน CI (postgres + redis + minio)
  # ============================================================================
  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    needs: [backend, admin-ui]
    # ข้ามใน PR → ใช้ resources เยอะ + ช้า
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend healthy
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Run smoke test
        run: python3 scripts/smoke_e2e.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Cleanup
        if: always()
        run: docker compose down -v
