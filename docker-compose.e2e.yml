# docker-compose.e2e.yml — integration / smoke test override
#
# ทำไมต้องมีไฟล์นี้:
#   - เครื่อง dev อาจมีโปรเจกต์อื่นจองพอร์ต 5432/6379/9000/9001 อยู่แล้ว
#     (เช่น concert-* containers) → signage จะ bind ทับไม่ได้
#   - ไฟล์นี้ "ยกเลิก" การ publish host port ของ pg/redis/minio (!reset null)
#     backend ยังคุยกับมันได้ผ่าน docker network ด้วยชื่อ service (postgres/redis/minio)
#   - บังคับ DATABASE_URL ให้ใช้ Postgres จริง (root .env ตั้งเป็น sqlite ไว้)
#
# รัน:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build postgres redis minio backend worker
#   python scripts/smoke_e2e.py
services:
  postgres:
    ports: !reset null

  redis:
    ports: !reset null

  minio:
    ports: !reset null

  backend:
    # ชี้ DB ไป Postgres ของ stack นี้ (override sqlite ใน .env)
    environment:
      DATABASE_URL: postgresql+asyncpg://signage:signage_dev_change_me@postgres:5432/signage
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000

  worker:
    environment:
      DATABASE_URL: postgresql+asyncpg://signage:signage_dev_change_me@postgres:5432/signage
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
