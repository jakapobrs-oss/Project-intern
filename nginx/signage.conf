# ============================================================================
# nginx reverse proxy — Production
#
# Routes:
#   / → admin-ui (Next.js standalone)
#   /api/ → backend (FastAPI)
#   /minio/ → MinIO console (optional, ปิดโดย default ใน production)
#
# TLS: ใช้ Let's Encrypt (mount /etc/letsencrypt จาก host)
# ตัวอย่างขอ cert: certbot --nginx -d signage.example.com
# ============================================================================

# Force HTTPS — redirect 80 → 443
server {
    listen 80;
    server_name _;

    # ACME challenge สำหรับ certbot renew
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main vhost — HTTPS
server {
    listen 443 ssl http2;
    server_name _;     # เปลี่ยนเป็น signage.example.com ใน production

    # Let's Encrypt — แก้ path ตาม domain
    # ssl_certificate     /etc/letsencrypt/live/signage.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/signage.example.com/privkey.pem;

    # self-signed (dev) — สร้างด้วย: openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
    #   -keyout privkey.pem -out fullchain.pem -subj "/CN=signage.local"
    ssl_certificate     /etc/letsencrypt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (เสริม middleware backend)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # อัปโหลด file ขนาดใหญ่ (video content) — default 1m ไม่พอ
    client_max_body_size 500m;

    # ===== /api/ → FastAPI backend =====
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (เผื่อมี SSE/WS ในอนาคต)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # timeout สำหรับ upload ใหญ่
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== /healthz → backend healthcheck =====
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        access_log off;          # spam จาก k8s probe
    }

    # ===== / → admin-ui (Next.js) =====
    location / {
        proxy_pass http://admin-ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / static
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ===== /_next/static → cache aggressive (immutable) =====
    location /_next/static {
        proxy_pass http://admin-ui:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===== ปิด access log endpoints ที่ noisy =====
    location = /api/v1/metrics {
        access_log off;
        proxy_pass http://backend:8000/api/v1/metrics;
        # restrict to monitoring network (optional)
        # allow 10.0.0.0/8; deny all;
    }
}
